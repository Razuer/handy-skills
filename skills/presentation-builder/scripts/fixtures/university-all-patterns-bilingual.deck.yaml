        numeric: true
        align: right
      - id: "mean"
        label:
          en: "Mean"
          pl: "Średnia"
        numeric: true
        align: right
    rows:
      - model:
          en: "Morgan + RF"
          pl: "Morgan + RF"
        bbbp: 70.1
        tox21: 74.0
        clintox: 81.2
        mean: 75.1
      - model:
