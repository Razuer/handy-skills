slides:
  - id: cover
    pattern: cover
    title:
      en: "Graph Neural Networks for Molecular Property Prediction"
      pl: "Grafowe sieci neuronowe w predykcji własności molekularnych"
    subtitle:
      en: "A bilingual fixture for every generated slide pattern"
      pl: "Dwujęzyczny przykład każdego generowanego wzorca slajdu"
    unit:
      en: "Faculty of Information and Communication Technology"
      pl: "Wydział Informatyki i Telekomunikacji"
    fields:
      Speaker:
        en: "Your Name"
        pl: "Imię i nazwisko"
      Date:
        en: "17 May 2026"
        pl: "17 maja 2026"
      Advisor:
        en: "Prof. A. Example"
        pl: "Prof. A. Example"
      Programme:
        en: "Computer Science seminar"
        pl: "Seminarium z informatyki"
    notes: "Cover. Introduce the bilingual fixture and PWR shell."
    script:
      cue:
        en: "[confirm English language mode]"
        pl: "[potwierdź tryb języka polskiego]"
      text:
        en: "Welcome. This fixture demonstrates every generator pattern in the university template."
        pl: "Dzień dobry. Ten przykład pokazuje każdy wzorzec generatora w szablonie uczelnianym."
      transition:
        en: "First, the agenda."
        pl: "Najpierw plan prezentacji."
  - id: agenda
    pattern: agenda
    eyebrow:
      en: "Outline"
      pl: "Plan"
    title:
      en: "Agenda"
      pl: "Agenda"
    subtitle:
      en: "Six sections and one appendix"
      pl: "Sześć części i jeden dodatek"
    items:
      - title:
          en: "Background"
          pl: "Tło"
        meta:
          en: "5 min"
          pl: "5 min"
      - title:
          en: "Method"
          pl: "Metoda"
        meta:
          en: "10 min"
          pl: "10 min"
      - title:
          en: "Results"
          pl: "Wyniki"
        meta:
          en: "7 min"
          pl: "7 min"
      - title:
          en: "Discussion"
          pl: "Dyskusja"
        meta:
          en: "5 min"
          pl: "5 min"
      - title:
          en: "Backup"
          pl: "Dodatek"
        meta:
          en: "as needed"
          pl: "w razie potrzeby"
    notes: "Agenda. Keep the bilingual sequence compact."
    script:
      text:
        en: "The talk follows the same structure as the original template: background, method, results, discussion, and backup."
        pl: "Prezentacja zachowuje strukturę oryginalnego szablonu: tło, metodę, wyniki, dyskusję i dodatek."
      transition:
        en: "We start with a definition."
        pl: "Zaczynamy od definicji."
  - id: definition
    pattern: definition
    eyebrow:
      en: "Background"
      pl: "Tło"
    title:
      en: "What is a graph neural network?"
      pl: "Czym jest grafowa sieć neuronowa?"
    tag:
      en: "Definition"
      pl: "Definicja"
    term:
      en: "Graph Neural Network"
      pl: "Grafowa sieć neuronowa"
    notation: "G = (V, E), h<sub>v</sub><sup>(k)</sup>"
    body:
      en: "A GNN updates node, edge, or graph representations by aggregating information over graph neighborhoods."
      pl: "GSN aktualizuje reprezentacje węzłów, krawędzi lub grafu przez agregację informacji z sąsiedztwa."
    sideTitle:
      en: "For molecules"
      pl: "Dla molekuł"
    items:
      - title:
          en: "Atoms"
          pl: "Atomy"
        body:
          en: "nodes with features"
          pl: "węzły z cechami"
      - title:
          en: "Bonds"
          pl: "Wiązania"
        body:
          en: "typed graph edges"
          pl: "typowane krawędzie grafu"
      - title:
          en: "Readout"
          pl: "Odczyt"
        body:
          en: "one vector per molecule"
          pl: "jeden wektor na molekułę"
    notes: "Definition. Establish shared vocabulary."
    script:
      text:
        en: "A molecule becomes a graph, and a GNN learns how atom neighborhoods should influence the final property prediction."
        pl: "Molekuła staje się grafem, a GSN uczy się wpływu sąsiedztw atomów na końcową predykcję własności."
      transition:
        en: "Now split the talk into background."
        pl: "Teraz przechodzimy do części z tłem."
  - id: section-background
    pattern: section-divider
    railTitle:
      en: "Section 01"
      pl: "Sekcja 01"
    number:
      en: "01"
      pl: "01"
    eyebrow:
      en: "Section"
      pl: "Sekcja"
    title:
      en: "Background"
      pl: "Tło"
    subtitle:
      en: "Why molecular structure is awkward for fixed tables."
      pl: "Dlaczego struktura molekuł nie pasuje do stałych tabel."
    meta:
      en: "Section 01 of 26"
      pl: "Sekcja 01 z 26"
    duration:
      en: "5 min"
      pl: "5 min"
    notes: "Section divider — Background."
    script:
      cue:
        en: "[short pause]"
        pl: "[krótka pauza]"
      text:
        en: "The background section explains why graph structure is the natural input."
        pl: "Część z tłem wyjaśnia, dlaczego struktura grafowa jest naturalnym wejściem."
      transition:
        en: "The problem has three parts."
        pl: "Problem ma trzy części."
  - id: background-problem
    pattern: bullets
    eyebrow:
      en: "Background · Problem"
      pl: "Tło · Problem"
    title:
      en: "Molecules are small, irregular graphs"
      pl: "Molekuły są małymi, nieregularnymi grafami"
    subtitle:
      en: "The data shape is the modeling challenge."
      pl: "Kształt danych jest wyzwaniem modelowania."
    items:
      - title:
          en: "Variable topology"
          pl: "Zmienna topologia"
        body:
          en: "Atom counts and bond patterns differ."
          pl: "Liczby atomów i wzorce wiązań są różne."
      - title:
          en: "Permutation symmetry"
          pl: "Symetria permutacji"
        body:
          en: "Renumbering atoms must not change predictions."
          pl: "Zmiana numeracji atomów nie może zmieniać predykcji."
      - title:
          en: "Sparse labels"
          pl: "Rzadkie etykiety"
        body:
          en: "Assays are costly and noisy."
          pl: "Testy są kosztowne i zaszumione."
    notes: "Background. State the structural modeling challenge."
    script:
      text:
        en: "The challenge is that the input is not a fixed table. It is an irregular object with symmetries."
        pl: "Wyzwanie polega na tym, że wejście nie jest stałą tabelą. To nieregularny obiekt z symetriami."
      transition:
        en: "A quote captures the motivation."
        pl: "Motywację dobrze oddaje cytat."
  - id: motivation-quote
    pattern: quote
    title:
      en: "Motivation"
      pl: "Motywacja"
    quote:
      en: "The graph is the molecule; the descriptor is only a lossy summary."
      pl: "Graf jest molekułą; deskryptor jest tylko stratnym streszczeniem."
    author:
      en: "Seminar framing"
      pl: "Rama seminarium"
    source:
      en: "molecular ML practice"
      pl: "praktyka molekularnego uczenia maszynowego"
    notes: "Quote. Read slowly."
    script:
      cue:
        en: "[read slowly]"
        pl: "[czytaj wolniej]"
      text:
        en: "The quote is a reminder that descriptors simplify a structure before the model can learn from it."
        pl: "Cytat przypomina, że deskryptory upraszczają strukturę zanim model może się z niej uczyć."
      transition:
        en: "The domain scale makes the approach practical."
        pl: "Skala domeny sprawia, że podejście jest praktyczne."
  - id: domain-context
    pattern: full-bleed
    railTitle:
      en: "Domain context"
      pl: "Kontekst domeny"
    eyebrow:
      en: "Background · Domain context"
      pl: "Tło · Kontekst domeny"
    title:
      en: "Drug-like molecules are small enough for message passing"
      pl: "Molekuły lekopodobne są dość małe dla propagacji komunikatów"
    subtitle:
      en: "Most benchmark graphs have tens of atoms."
      pl: "Większość grafów benchmarkowych ma dziesiątki atomów."
    image:
      slotId: "bleed-context"
      placeholder:
        en: "Drop a domain photo here"
        pl: "Upuść tutaj zdjęcie domeny"
    notes: "Domain context. Exercise full-bleed image slot."
    script:
      text:
        en: "Molecular graphs are small compared with social or web graphs, so repeated local updates are computationally feasible."
        pl: "Grafy molekularne są małe w porównaniu z grafami społecznymi lub sieciowymi, więc lokalne aktualizacje są wykonalne obliczeniowo."
      transition:
        en: "Now move to the method section."
        pl: "Teraz przechodzimy do metody."
  - id: section-method
    pattern: section-divider
    railTitle:
      en: "Section 02"
      pl: "Sekcja 02"
    number:
      en: "02"
      pl: "02"
    eyebrow:
      en: "Section"
      pl: "Sekcja"
    title:
      en: "Method"
      pl: "Metoda"
    subtitle:
      en: "Parse, featurize, pass messages, pool, predict."
      pl: "Parsuj, twórz cechy, propaguj komunikaty, agreguj, predykuj."
    meta:
      en: "Section 02 of 26"
      pl: "Sekcja 02 z 26"
    duration:
      en: "10 min"
      pl: "10 min"
    notes: "Section divider — Method."
    script:
      text:
        en: "The method section follows the graph through the model."
        pl: "Część metody prowadzi graf przez model."
      transition:
        en: "Start with the pipeline."
        pl: "Zaczynamy od potoku."
  - id: method-pipeline
    pattern: pipeline
    eyebrow:
      en: "Method · Pipeline"
      pl: "Metoda · Potok"
    title:
      en: "The molecular GNN workflow has five stages"
      pl: "Przepływ pracy molekularnej GSN ma pięć etapów"
    steps:
      - title:
          en: "Parse"
          pl: "Parsowanie"
        body:
          en: "SMILES to graph."
          pl: "SMILES do grafu."
        tag:
          en: "input"
          pl: "wejście"
      - title:
          en: "Featurize"
          pl: "Cechy"
        body:
          en: "Atoms and bonds."
          pl: "Atomy i wiązania."
        tag:
          en: "x, e"
          pl: "x, e"
      - title:
          en: "Message pass"
          pl: "Komunikaty"
        body:
          en: "Update node states."
          pl: "Aktualizuj stany węzłów."
        tag:
          en: "layers"
          pl: "warstwy"
      - title:
          en: "Readout"
          pl: "Odczyt"
        body:
          en: "Pool graph vector."
          pl: "Agreguj wektor grafu."
        tag:
          en: "pool"
          pl: "pool"
      - title:
          en: "Predict"
          pl: "Predykcja"
        body:
          en: "Estimate property."
          pl: "Oszacuj własność."
        tag:
          en: "output"
          pl: "wyjście"
    notes: "Pipeline. Walk left to right."
    script:
      text:
        en: "The pipeline is parse, featurize, message pass, readout, and prediction."
        pl: "Potok obejmuje parsowanie, cechy, komunikaty, odczyt i predykcję."
      transition:
        en: "Compare this with a fingerprint baseline."
        pl: "Porównajmy to z bazą fingerprintów."
  - id: method-comparison
    pattern: comparison
    eyebrow:
      en: "Method · Comparison"
      pl: "Metoda · Porównanie"
    title:
      en: "Fingerprints are fixed; GNN features are learned"
      pl: "Fingerprinty są stałe; cechy GSN są uczone"
    items:
      - tag:
          en: "A · Fingerprint"
          pl: "A · Fingerprint"
        title:
          en: "Hand-coded neighborhoods"
          pl: "Ręcznie zakodowane sąsiedztwa"
        body:
          en: "Fast, strong, and fixed before training."
          pl: "Szybkie, mocne i ustalone przed treningiem."
        points:
          - en: "robust baseline"
            pl: "odporna baza"
          - en: "limited adaptation"
            pl: "ograniczona adaptacja"
      - tag:
          en: "B · GNN"
          pl: "B · GSN"
        title:
          en: "Learned message passing"
          pl: "Uczona propagacja komunikatów"
        body:
          en: "Flexible, but more sensitive to protocol."
          pl: "Elastyczna, lecz bardziej wrażliwa na protokół."
        points:
          - en: "task-specific features"
            pl: "cechy zależne od zadania"
          - en: "needs regularization"
            pl: "wymaga regularyzacji"
    notes: "Comparison. Exercise two-column layout."
    script:
      text:
        en: "Fingerprints encode structure before learning, while GNNs learn how to use the structure for the task."
        pl: "Fingerprinty kodują strukturę przed uczeniem, a GSN uczą się wykorzystywać strukturę dla zadania."
      transition:
        en: "There are three common model families."
        pl: "Istnieją trzy popularne rodziny modeli."
  - id: method-families
    pattern: comparison-3col
    eyebrow:
      en: "Method · Three families"
      pl: "Metoda · Trzy rodziny"
    title:
      en: "Most molecular GNNs fall into three families"
      pl: "Większość molekularnych GSN należy do trzech rodzin"
    items:
      - tag:
          en: "Spectral"
          pl: "Spektralne"
        title:
          en: "Graph convolutions"
          pl: "Sploty grafowe"
        body:
          en: "Filters through graph operators."
          pl: "Filtry przez operatory grafowe."
        points:
          - en: "theoretical"
            pl: "teoretyczne"
          - en: "less used here"
            pl: "rzadziej używane tutaj"
      - tag:
          en: "Spatial"
          pl: "Przestrzenne"
        title:
          en: "MPNN / GINE"
          pl: "MPNN / GINE"
        body:
          en: "Local bond-aware aggregation."
          pl: "Lokalna agregacja z wiązaniami."
        points:
          - en: "chemistry aligned"
            pl: "zgodne z chemią"
          - en: "strong baseline"
            pl: "mocna baza"
      - tag:
          en: "Attention"
          pl: "Uwaga"
        title:
          en: "GAT / transformers"
          pl: "GAT / transformatory"
        body:
          en: "Weighted neighbors or tokens."
          pl: "Ważeni sąsiedzi lub tokeny."
        points:
          - en: "flexible"
            pl: "elastyczne"
          - en: "more costly"
            pl: "droższe"
    notes: "Three columns. Keep copy short for both languages."
    script:
      text:
        en: "The spatial family is the default practical choice for this fixture."
        pl: "Rodzina przestrzenna jest domyślnym praktycznym wyborem w tym przykładzie."
      transition:
        en: "The update rule shows why."
        pl: "Reguła aktualizacji pokazuje dlaczego."
  - id: update-rule
    pattern: equation
    eyebrow:
      en: "Method · Update rule"
      pl: "Metoda · Reguła aktualizacji"
    title:
      en: "Message passing is a repeated local update"
      pl: "Propagacja komunikatów to powtarzana lokalna aktualizacja"
    equation: '<span class="var">h</span><sub>v</sub><sup>(k+1)</sup> <span class="op">=</span> <span class="fn">φ</span>(<span class="var">h</span><sub>v</sub><sup>(k)</sup>, <span class="agg">AGG</span><sub>u∈N(v)</sub> <span class="fn">ψ</span>(<span class="var">h</span><sub>u</sub><sup>(k)</sup>, <span class="var">e</span><sub>uv</sub>))'
    caption:
      en: "AGG is permutation invariant."
      pl: "AGG jest niezmiennicze względem permutacji."
    variables:
      - term:
          en: "node state"
          pl: "stan węzła"
        desc:
          en: "representation of one atom"
          pl: "reprezentacja jednego atomu"
      - term:
          en: "bond features"
          pl: "cechy wiązania"
        desc:
          en: "edge information"
          pl: "informacja krawędzi"
    notes: "Equation. Exercise raw equation HTML and localized caption."
    script:
      text:
        en: "Each layer updates an atom using messages from its neighbors, and the aggregation must ignore atom numbering."
        pl: "Każda warstwa aktualizuje atom komunikatami od sąsiadów, a agregacja musi ignorować numerację atomów."
      transition:
        en: "The training loop is short."
        pl: "Pętla treningowa jest krótka."
  - id: pseudocode
    pattern: code
    eyebrow:
      en: "Method · Pseudocode"
      pl: "Metoda · Pseudokod"
    title:
      en: "A minimal training step fits on one slide"
      pl: "Minimalny krok treningu mieści się na jednym slajdzie"
    filename:
      en: "train_step.py"
      pl: "train_step.py"
    language: "python"
    code: |
      for batch in loader:
          graph, y = batch.graph, batch.y
          pred = model(graph.x, graph.edge_index, graph.edge_attr)
          loss = criterion(pred, y)
          loss.backward()
          optimizer.step()
    items:
      - title:
          en: "Batch object"
          pl: "Obiekt batch"
        body:
          en: "packs many small molecules"
          pl: "pakuje wiele małych molekuł"
      - title:
          en: "Edge index"
          pl: "Indeks krawędzi"
        body:
          en: "stores sparse connectivity"
          pl: "przechowuje rzadkie połączenia"
    notes: "Code. Exercise code block with notes."
    script:
      text:
        en: "This code is compact because the graph library handles batching and sparse connectivity."
        pl: "Kod jest krótki, bo biblioteka grafowa obsługuje batchowanie i rzadkie połączenia."
      transition:
        en: "Now summarize the result."
        pl: "Teraz podsumujmy wynik."
  - id: headline-stat
    pattern: big-number
    eyebrow:
      en: "Results · Headline"
      pl: "Wyniki · Teza"
    title:
      en: "GNNs improve the average score"
      pl: "GSN poprawiają średni wynik"
    value:
      en: "+4.2"
      pl: "+4,2"
    unit:
      en: "%"
      pl: "%"
    label:
      en: "Mean ROC-AUC improvement"
      pl: "Średnia poprawa ROC-AUC"
    body:
      en: "Average gain over the fingerprint baseline across compact fixture tasks."
      pl: "Średni zysk względem bazy fingerprintów w zadaniach przykładowych."
    footnote:
      en: "Fixture values, not a new benchmark."
      pl: "Wartości przykładowe, nie nowy benchmark."
    notes: "Big number. Exercise headline stat."
    script:
      text:
        en: "The headline number is useful, but we should immediately inspect where it comes from."
        pl: "Liczba główna jest przydatna, ale od razu trzeba sprawdzić, skąd pochodzi."
      transition:
        en: "The chart gives that breakdown."
        pl: "Wykres pokazuje ten podział."
  - id: per-dataset-chart
    pattern: bar-chart
    eyebrow:
      en: "Results · Per-dataset chart"
      pl: "Wyniki · Wykres zbiorów"
    title:
      en: "The largest gains appear on toxicity tasks"
      pl: "Największe zyski widać w zadaniach toksyczności"
    bars:
      - label:
          en: "BBBP"
          pl: "BBBP"
        value:
          en: "+3.1"
          pl: "+3,1"
        height: 54
      - label:
          en: "Tox21"
          pl: "Tox21"
        value:
          en: "+4.7"
          pl: "+4,7"
        height: 66
      - label:
          en: "ClinTox"
          pl: "ClinTox"
        value:
          en: "+8.4"
          pl: "+8,4"
        height: 88
        win: true
      - label:
          en: "BACE"
          pl: "BACE"
        value:
          en: "+2.8"
          pl: "+2,8"
        height: 48
      - label:
          en: "SIDER"
          pl: "SIDER"
        value:
          en: "-0.9"
          pl: "-0,9"
        height: 28
    calloutValue:
      en: "+8.4%"
      pl: "+8,4%"
    callout:
      en: "largest fixture gain"
      pl: "największy zysk przykładu"
    chartNotes:
      - en: "Bars show best GNN minus baseline."
        pl: "Słupki pokazują najlepszą GSN minus baza."
      - en: "Negative values mark failure cases."
        pl: "Wartości ujemne oznaczają przypadki porażki."
    notes: "Bar chart. Include win bar and callouts."
    script:
      text:
        en: "The largest gain is ClinTox, while SIDER remains a difficult case."
        pl: "Największy zysk dotyczy ClinTox, a SIDER pozostaje trudnym przypadkiem."
      transition:
        en: "A table complements the chart."
        pl: "Tabela uzupełnia wykres."
  - id: results-table
    pattern: table
    eyebrow:
      en: "Results · Table"
      pl: "Wyniki · Tabela"
    title:
      en: "The table keeps numeric alignment visible"
      pl: "Tabela pokazuje wyrównanie kolumn liczbowych"
    columns:
