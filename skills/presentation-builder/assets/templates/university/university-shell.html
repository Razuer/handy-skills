<!doctype html>
<html lang="{{HTML_LANG}}">
<head>
<meta charset="utf-8" />
<title>{{DOCUMENT_TITLE}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ─── Politechnika Wrocławska brand tokens (official 2024) ───────── */
  :root {
    /* Color */
    --pwr-red:    #9A342D;   /* PANTONE 484 — primary burgundy */
    --pwr-red-d:  #6c241f;   /* derived deep — accents on cream */
    --pwr-cream:  #F1D1A2;   /* PANTONE 156 — official cream/peach */
    --pwr-cream-l:#f9ecd5;   /* tint of cream — soft section bg */
    --pwr-ink:    #000000;   /* official black */
    --pwr-muted:  #6a625a;   /* warm grey, derived */
    --pwr-hair:   #e3d8c8;   /* warm hairline, derived from cream */
    --pwr-bg:     #ffffff;
    --pwr-on-red: #F1D1A2;   /* cream sits on red in the brand */
    --pwr-on-red-soft: rgba(241, 209, 162, 0.78);

    /* Type — Trebuchet MS is the template font; Source Sans 3 is a web fallback. */
    --font-sans:    "Trebuchet MS", "Source Sans 3", system-ui, sans-serif;
    --font-display: "Trebuchet MS", "Source Sans 3", system-ui, sans-serif;
    --font-mono:    "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --font-serif:   "Source Serif 4", "Times New Roman", serif;

    /* Type scale (1920×1080) */
    --t-cover-title: 92px;
    --t-divider:     132px;
    --t-title:       60px;
    --t-subtitle:    34px;
    --t-body:        28px;
    --t-small:       24px;
    --t-mono:        24px;

    /* Spacing */
    --pad-top:    150px;   /* clears top rail (70px) + breathing room */
    --pad-bottom: 130px;   /* clears footer chrome (60px) + breathing room */
    --pad-x:      120px;
    --gap-title:  48px;
    --gap-item:   24px;
    --gap-tight:  14px;

    /* Chrome */
    --rail-h:    70px;
    --footer-h:  68px;
  }

  html, body { margin: 0; padding: 0; background: #0a0a0a; }
  body {
    font-family: var(--font-sans);
    color: var(--pwr-ink);
  }

  /* ─── Language switching — every translatable run is wrapped in
        <span class="i18n" data-en="..." data-pl="..."></span>.
        A small script swaps textContent on lang change. ─────────── */
  /* No CSS needed — JS handles the swap, see <script id="i18n"> */

  deck-stage { background: var(--pwr-bg); }
  deck-stage::part(stage) { background: #0a0a0a; }

  section.slide {
    width: 1920px; height: 1080px;
    background: var(--pwr-bg); color: var(--pwr-ink);
    box-sizing: border-box;
    padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ─── Top red rail ───────────────────────────────────────────────── */
  .rail {
    position: absolute; inset: 0 0 auto 0;
    height: var(--rail-h);
    background: var(--pwr-red);
    color: var(--pwr-on-red);
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 32px;
    padding: 0 var(--pad-x);
    font-family: var(--font-sans);
    z-index: 2;
  }
  .rail .lockup {
    display: flex; align-items: center;
    height: 100%;
  }
  .rail .lockup img {
    height: 44px; display: block;
  }
  .rail .lockup .lang-pl { display: none; }
  body.lang-pl .rail .lockup .lang-en { display: none; }
  body.lang-pl .rail .lockup .lang-pl { display: block; }

  .rail .title-mid {
    font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--pwr-on-red-soft);
    text-align: center;
    font-weight: 500;
  }
  .rail .meta {
    font-size: 24px;
    font-variant-numeric: tabular-nums;
    color: var(--pwr-on-red-soft);
    display: flex; gap: 18px; align-items: center;
    font-weight: 500;
  }

  /* ─── Footer chrome ─────────────────────────────────────────────── */
  .footer {
    position: absolute; inset: auto 0 0 0;
    height: var(--footer-h);
    border-top: 1px solid var(--pwr-hair);
    padding: 0 var(--pad-x);
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 32px;
    font-family: var(--font-sans);
    font-size: 24px;
    color: var(--pwr-muted);
    background: var(--pwr-bg);
    z-index: 2;
  }
  .footer .speaker { grid-column: 1; font-weight: 600; color: var(--pwr-ink); }
  .footer .page { grid-column: 2; justify-self: center; font-variant-numeric: tabular-nums; }
  .footer .partners { grid-column: 3; justify-self: end; display: flex; gap: 24px; align-items: center; }
  .footer .partners img {
    height: 36px; display: block; opacity: 0.85;
    object-fit: contain;
  }
  body.no-footer .footer { display: none; }
  body.no-partners .footer .partners { display: none; }

  /* ─── Typography ─────────────────────────────────────────────────── */
  .eyebrow {
    font-family: var(--font-sans);
    font-size: var(--t-mono);
    color: var(--pwr-red);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin: 0 0 var(--gap-tight) 0;
  }
  h1.title, h2.title {
    font-family: var(--font-display);
    font-size: var(--t-title);
    font-weight: 700;
    line-height: 1.06;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
    color: var(--pwr-ink);
  }
  .title-rule {
    width: 88px; height: 4px; background: var(--pwr-red);
    margin: 22px 0 12px;
  }
  .subtitle {
    font-family: var(--font-sans);
    font-size: var(--t-subtitle);
    color: var(--pwr-muted);
    line-height: 1.28;
    margin: 0;
    max-width: 1500px;
    text-wrap: pretty;
  }
  .body {
    font-size: var(--t-body);
    line-height: 1.45;
    color: var(--pwr-ink);
    text-wrap: pretty;
  }

  .content { flex: 1; display: flex; flex-direction: column; gap: var(--gap-title); min-height: 0; }
  .content.fit-footer { box-sizing: border-box; padding-bottom: 44px; }
  .stack { display: flex; flex-direction: column; gap: var(--gap-item); }
  .stack-tight { display: flex; flex-direction: column; gap: var(--gap-tight); }

  /* ─── Slide 01 · Cover — fully overrides .slide padding ─────────── */
  section.slide.cover {
    padding: 0;
    display: grid;
    grid-template-columns: 1.18fr 1fr;
    grid-template-rows: 1fr auto;
    overflow: hidden;
  }
  .cover-left {
    grid-column: 1;
    grid-row: 1;
    padding: 88px 88px 72px 110px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    background: var(--pwr-bg);
    gap: 48px;
    min-height: 0;
  }
  .cover-brand {
    display: flex; flex-direction: column; gap: 24px;
    align-items: flex-start;
  }
  .cover-brand .pwr-mark img {
    height: 132px; display: block;
  }
  .cover-brand .pwr-mark .lang-pl,
  .cover-brand .pwr-mark.show-en .lang-pl { display: none; }
  body.lang-pl .cover-brand .pwr-mark .lang-en { display: none; }
  body.lang-pl .cover-brand .pwr-mark .lang-pl { display: block; }
  .cover-brand .unit-line {
    font-family: var(--font-sans);
    font-size: 24px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--pwr-red);
    font-weight: 700;
    border-top: 3px solid var(--pwr-red);
    padding-top: 16px;
    width: fit-content;
  }
  .cover-title-block { display: flex; flex-direction: column; gap: 24px; }
  .cover-title {
    font-family: var(--font-display);
    font-size: var(--t-cover-title);
    font-weight: 700;
    line-height: 1.04;
    letter-spacing: -0.02em;
    color: var(--pwr-ink);
    margin: 0;
    text-wrap: balance;
    max-width: 1000px;
  }
  .cover-title em {
    font-style: italic; font-family: var(--font-serif); font-weight: 500;
    color: var(--pwr-red);
  }
  .cover-sub {
    font-size: 30px;
    line-height: 1.32;
    color: var(--pwr-muted);
    margin: 0;
    max-width: 920px;
    text-wrap: pretty;
  }

  .cover-right {
    grid-column: 2;
    grid-row: 1;
    background: var(--pwr-red);
    color: var(--pwr-on-red);
    padding: 88px 88px 72px;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    position: relative;
    z-index: 0;
    min-height: 0;
  }
  .cover-right .pwr-eagle {
    position: absolute; top: 96px; right: 88px;
    height: 220px;
  }
  .cover-right .pwr-eagle img {
    height: 100%; display: block;
    /* The vert logo has a white background built in — we want the cover
       version to feel embedded; the mark itself uses cream-on-red so it
       reads well on the red panel. */
  }
  .cover-right .pwr-eagle .lang-pl { display: none; }
  body.lang-pl .cover-right .pwr-eagle .lang-en { display: none; }
  body.lang-pl .cover-right .pwr-eagle .lang-pl { display: block; }

  .cover-right .meta-block {
    display: flex; flex-direction: column; gap: 26px;
  }
  .cover-right .meta-block dt {
    font-family: var(--font-sans);
    font-size: 24px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--pwr-on-red-soft);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .cover-right .meta-block dd {
    font-size: 30px; font-weight: 500; margin: 0; line-height: 1.2;
    color: var(--pwr-on-red);
  }

  /* Cover footer strip — explicit height so it never gets clipped */
  .cover-strip {
    grid-column: 1 / -1;
    grid-row: 2;
    height: 132px;
    background: var(--pwr-cream-l);
    border-top: 4px solid var(--pwr-red);
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 0 var(--pad-x);
    gap: 40px;
    box-sizing: border-box;
    position: relative;
    z-index: 2;
  }
  .cover-strip .copy {
    font-family: var(--font-sans);
    font-size: 24px;
    color: var(--pwr-red-d);
    letter-spacing: 0.04em;
    font-weight: 500;
  }
  .cover-strip .partners {
    display: flex; align-items: center; gap: 44px;
  }
  .cover-strip .partners img {
    height: 64px; display: block;
    object-fit: contain;
  }
  .cover-strip .partners .sep {
    width: 1px; height: 56px; background: rgba(0,0,0,.15);
  }

  /* ─── Section divider — full-bleed red ───────────────────────────── */
  section.slide.divider {
    padding: 0;
    background: var(--pwr-red);
    color: var(--pwr-on-red);
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  section.slide.divider .rail {
    background: transparent;
    border-bottom: 1px solid rgba(241, 209, 162, 0.25);
    position: static;
  }
  section.slide.divider .body-area {
    padding: 0 var(--pad-x);
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 80px;
    min-height: 0;
  }
  .divider-num {
    font-family: var(--font-display);
    font-size: 360px;
    line-height: 0.85;
    font-weight: 700;
    letter-spacing: -0.04em;
    color: rgba(241, 209, 162, 0.16);
  }
  .divider-block { display: flex; flex-direction: column; gap: 24px; }
  .divider-eyebrow {
    font-family: var(--font-sans);
    font-size: 26px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--pwr-on-red-soft); font-weight: 700;
  }
  .divider-title {
    font-family: var(--font-display);
    font-size: var(--t-divider);
    font-weight: 700;
    line-height: 1.0;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
    max-width: 1300px;
    color: var(--pwr-on-red);
  }
  .divider-rule { width: 120px; height: 4px; background: var(--pwr-on-red); }
  .divider-lede {
    font-size: 30px; line-height: 1.3;
    color: var(--pwr-on-red-soft);
    max-width: 900px; margin: 0;
  }
  .divider-foot {
    padding: 0 var(--pad-x) 40px;
    display: flex; justify-content: space-between;
    font-family: var(--font-sans);
    font-size: 24px;
    color: var(--pwr-on-red-soft);
  }

  /* ─── Agenda ─────────────────────────────────────────────────────── */
  ol.agenda { margin: 0; padding: 0; list-style: none; }
  ol.agenda li {
    display: grid;
    grid-template-columns: 90px 1fr auto;
    align-items: center;
    gap: 36px;
    padding: 24px 0;
    border-top: 1px solid var(--pwr-hair);
    font-size: var(--t-body);
  }
  ol.agenda li:last-child { border-bottom: 1px solid var(--pwr-hair); }
  ol.agenda li .idx {
    font-family: var(--font-mono);
    font-size: var(--t-mono);
    color: var(--pwr-red);
    font-weight: 500;
  }
  ol.agenda li .label { font-weight: 700; font-size: 32px; }
  ol.agenda li .dur {
    font-family: var(--font-mono);
    font-size: var(--t-small);
    color: var(--pwr-muted);
  }

  /* ─── Bulleted body ──────────────────────────────────────────────── */
  ul.bullets { margin: 0; padding: 0; list-style: none; }
  ul.bullets li {
    display: grid;
    grid-template-columns: 36px 1fr;
    gap: 16px;
    padding: 20px 0;
    border-top: 1px solid var(--pwr-hair);
    font-size: var(--t-body); line-height: 1.4;
  }
  ul.bullets li:last-child { border-bottom: 1px solid var(--pwr-hair); }
  ul.bullets li::before {
    content: ""; display: block;
    width: 14px; height: 14px;
    margin-top: 14px;
    background: var(--pwr-red);
    transform: rotate(45deg);
  }
  ul.bullets .b-title { font-weight: 700; }
  ul.bullets .b-desc  { color: var(--pwr-muted); display: block; margin-top: 6px; font-size: var(--t-small); line-height: 1.4; }

  /* ─── Quote ──────────────────────────────────────────────────────── */
  .quote {
    background: var(--pwr-cream-l);
    margin: 0 -88px;
    padding: 80px 220px;
    box-sizing: border-box;
    border-left: 16px solid var(--pwr-red);
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    gap: 36px;
    min-height: 0;
  }
  .quote .mark {
    font-family: var(--font-serif);
    font-size: 200px;
    line-height: 0.5;
    color: var(--pwr-red);
    font-weight: 700;
  }
  .quote .body {
    font-family: var(--font-serif);
    font-size: 64px;
    line-height: 1.14;
    letter-spacing: -0.01em;
    font-weight: 500;
    color: var(--pwr-ink);
    margin: 0;
    max-width: 1400px;
    text-wrap: balance;
  }
  .quote .attr {
    font-family: var(--font-sans);
    font-size: 24px;
    color: var(--pwr-red-d);
    letter-spacing: 0.04em;
    display: flex; gap: 16px; align-items: baseline;
    border-top: 1px solid rgba(154,52,45,.25);
    padding-top: 18px;
    flex-wrap: wrap;
  }
  .quote .attr .name { font-weight: 700; color: var(--pwr-red-d); }
  .quote .attr .ref  { color: var(--pwr-muted); font-style: italic; font-family: var(--font-serif); }

  /* ─── Two-column comparison ──────────────────────────────────────── */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; flex: 1; min-height: 0; }
  .compare {
    display: flex; flex-direction: column; gap: 18px;
    padding: 28px 28px 28px 0;
    border-left: 6px solid var(--pwr-hair);
    padding-left: 32px;
  }
  .compare.alt { border-left-color: var(--pwr-red); }
  .compare-tag {
    font-family: var(--font-sans);
    font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--pwr-muted); font-weight: 700;
  }
  .compare.alt .compare-tag { color: var(--pwr-red); }
  .compare-h {
    font-size: 42px; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em;
    margin: 0; text-wrap: balance;
  }
  .compare-body { font-size: var(--t-body); line-height: 1.4; color: var(--pwr-muted); margin: 0; }
  .compare-list { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 0; }
  .compare-list li {
    display: grid; grid-template-columns: 28px 1fr; gap: 12px;
    padding: 14px 0; border-top: 1px solid var(--pwr-hair);
    font-size: var(--t-small); line-height: 1.4;
  }
  .compare-list li::before { content: "→"; color: var(--pwr-muted); font-family: var(--font-mono); }
  .compare.alt .compare-list li::before { color: var(--pwr-red); }
  .compare-list .b-title { font-weight: 700; display: block; }
  .compare-list .b-desc { color: var(--pwr-muted); display: block; margin-top: 6px; font-size: 22px; line-height: 1.4; }

  /* ─── Big stat ───────────────────────────────────────────────────── */
  .stat-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 80px; flex: 1; align-items: center; }
  .big-num {
    font-family: var(--font-display);
    font-size: 340px; line-height: 0.9;
    font-weight: 700; letter-spacing: -0.05em;
    color: var(--pwr-red);
    margin: 0;
  }
  .big-num .unit { font-size: 120px; color: var(--pwr-ink); margin-left: 8px; }
  .stat-side { display: flex; flex-direction: column; gap: 28px; }
  .stat-label {
    font-family: var(--font-sans);
    font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--pwr-red); font-weight: 700;
  }
  .stat-desc { font-size: 34px; line-height: 1.25; color: var(--pwr-ink); margin: 0; text-wrap: pretty; }
  .stat-foot {
    font-size: var(--t-small); color: var(--pwr-muted);
    border-top: 1px solid var(--pwr-hair);
    padding-top: 18px;
  }

  /* ─── Pipeline ───────────────────────────────────────────────────── */
  .pipeline {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 16px;
  }
  .step {
    background: var(--pwr-cream-l);
    padding: 30px 24px;
    display: flex; flex-direction: column; gap: 12px;
    position: relative;
    border-top: 4px solid var(--pwr-red);
  }
  .step-idx {
    font-family: var(--font-mono);
    font-size: 26px;
    color: var(--pwr-red);
    font-weight: 500;
  }
  .step-h { font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; margin: 0; }
  .step-d { font-size: var(--t-small); line-height: 1.4; color: var(--pwr-muted); margin: 0; }
  .step-tag {
    margin-top: auto;
    font-family: var(--font-mono); font-size: 24px;
    color: var(--pwr-red-d);
    padding-top: 14px;
    border-top: 1px dashed var(--pwr-hair);
  }

  /* ─── Table ──────────────────────────────────────────────────────── */
  table.data {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--t-small);
    font-variant-numeric: tabular-nums;
  }
  table.data thead th {
    text-align: left; padding: 16px 14px;
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 24px; color: var(--pwr-on-red);
    background: var(--pwr-red);
    letter-spacing: 0.04em;
  }
  table.data thead th.num { text-align: right; }
  table.data tbody td {
    padding: 16px 14px;
    border-bottom: 1px solid var(--pwr-hair);
    font-size: 26px;
  }
  table.data tbody td.num { text-align: right; font-family: var(--font-mono); }
  table.data tbody tr.best td { background: var(--pwr-cream-l); }
  table.data tbody tr.best td:first-child { font-weight: 700; color: var(--pwr-red-d); }
  table.data tbody td.delta-pos { color: var(--pwr-red); font-family: var(--font-mono); font-weight: 500; }
  .table-cap {
    font-family: var(--font-sans); font-size: 24px; color: var(--pwr-muted);
    margin-top: 14px; font-style: italic;
  }

  /* ─── Image-led ──────────────────────────────────────────────────── */
  .image-led { display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; flex: 1; min-height: 0; }
  .image-frame {
    background: var(--pwr-cream-l);
    border: 1px solid var(--pwr-hair);
    overflow: hidden;
    height: 100%;
    min-height: 0;
  }
  image-slot { width: 100%; height: 100%; display: block; }
  .caption-row {
    margin-top: 20px;
    font-family: var(--font-sans); font-size: 24px; color: var(--pwr-muted);
    display: flex; gap: 20px;
    border-top: 1px solid var(--pwr-hair); padding-top: 14px;
  }
  .caption-row .ref { font-weight: 700; color: var(--pwr-red); }

  /* ─── Timeline ───────────────────────────────────────────────────── */
  .timeline {
    display: grid; grid-template-columns: repeat(var(--timeline-cols, 6), minmax(0, 1fr));
    border-top: 4px solid var(--pwr-red);
  }
  .tl-col {
    padding: 28px 22px;
    border-right: 1px solid var(--pwr-hair);
    display: flex; flex-direction: column; gap: 14px;
    min-height: 360px;
    background: var(--pwr-bg);
  }
  .tl-col:last-child { border-right: none; }
  .tl-col.alt { background: var(--pwr-cream-l); }
  .tl-month {
    font-family: var(--font-mono); font-size: var(--t-mono); color: var(--pwr-muted);
    letter-spacing: 0.04em;
  }
  .tl-pill {
    display: inline-block;
    background: var(--pwr-ink); color: var(--pwr-cream);
    font-size: 24px; font-weight: 700;
    padding: 8px 14px;
    align-self: flex-start;
  }
  .tl-pill.alt { background: var(--pwr-red); color: var(--pwr-on-red); }
  .tl-note { font-size: 24px; line-height: 1.4; color: var(--pwr-ink); margin: 0; }

  /* ─── References ─────────────────────────────────────────────────── */
  ol.refs { margin: 0; padding: 0; list-style: none; column-count: 2; column-gap: 80px; }
  ol.refs li {
    break-inside: avoid;
    display: grid; grid-template-columns: 60px 1fr;
    gap: 14px; padding: 16px 0;
    border-top: 1px solid var(--pwr-hair);
    font-size: var(--t-small); line-height: 1.4;
  }
  ol.refs li .ref-idx { font-family: var(--font-mono); color: var(--pwr-red); font-size: 24px; font-weight: 500; }
  ol.refs li .ref-body .ref-authors { font-weight: 700; }
  ol.refs li .ref-body .ref-venue  { color: var(--pwr-muted); font-style: italic; }
  ol.refs li .ref-body .ref-doi    { font-family: var(--font-mono); color: var(--pwr-muted); font-size: var(--t-mono); line-height: 1.2; display: block; margin-top: 2px; overflow-wrap: anywhere; word-break: break-word; }

  /* ─── Closing / Q&A ──────────────────────────────────────────────── */
  section.slide.qa {
    background: var(--pwr-red);
    color: var(--pwr-on-red);
    padding: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  section.slide.qa .rail {
    background: transparent;
    border-bottom: 1px solid rgba(241, 209, 162, 0.25);
    position: static;
  }
  .qa-mid {
    padding: 0 var(--pad-x);
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 32px;
    min-height: 0;
  }
  .qa-eye {
    font-family: var(--font-sans);
    font-size: 26px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--pwr-on-red-soft); font-weight: 700;
  }
  .qa-h {
    font-family: var(--font-display);
    font-size: 220px; font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin: 0;
    color: var(--pwr-on-red);
  }
  .qa-sub {
    font-size: var(--t-subtitle);
    color: var(--pwr-on-red-soft);
    line-height: 1.25;
    margin: 0;
    max-width: 1300px;
  }
  .qa-bottom {
    padding: 28px var(--pad-x);
    border-top: 1px solid rgba(241, 209, 162, 0.25);
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 60px;
    font-family: var(--font-sans);
    font-size: 24px;
  }
  .qa-bottom dt { color: var(--pwr-on-red-soft); margin-bottom: 4px; font-size: 24px;
                  letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; }
  .qa-bottom dd { color: var(--pwr-on-red); margin: 0; font-weight: 500; font-size: 26px; }

  /* ─── Tweak: density ─────────────────────────────────────────────── */
  body.compact  { --pad-top: 120px; --pad-bottom: 100px; --pad-x: 90px; --gap-title: 36px; --gap-item: 18px; }
  body.spacious { --pad-top: 180px; --pad-bottom: 160px; --pad-x: 150px; --gap-title: 64px; --gap-item: 32px; }

  /* ─── Tweak: dark mode ───────────────────────────────────────────── */
  body.dark { --pwr-bg: #161312; --pwr-ink: #F1D1A2; --pwr-muted: #b8a795;
              --pwr-hair: #2a2421; --pwr-cream-l: #1f1a17; }
  body.dark .footer, body.dark section.slide { background: var(--pwr-bg); }
  body.dark .footer { color: var(--pwr-muted); }
  body.dark .footer .partners img { filter: invert(1) brightness(2); opacity: 0.7; }
  body.dark .step { background: #221d1a; }


  /* ═════════════ NEW SLIDE TYPES ═════════════════════════════════════ */

  /* ─── Definition card ────────────────────────────────────────────── */
  .def-grid { display: grid; grid-template-columns: 1fr 1.25fr; gap: 80px; flex: 1; align-items: center; min-height: 0; }
  .def-card {
    background: var(--pwr-cream-l);
    padding: 56px 48px;
    display: flex; flex-direction: column; gap: 24px;
    border-top: 6px solid var(--pwr-red);
  }
  .def-tag {
    font-family: var(--font-sans); font-size: 24px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--pwr-red); font-weight: 700;
  }
  .def-term {
    font-family: var(--font-display);
    font-size: 76px; font-weight: 700; line-height: 1.0;
    letter-spacing: -0.02em; color: var(--pwr-ink); margin: 0;
    text-wrap: balance;
  }
  .def-notation {
    font-family: var(--font-serif); font-style: italic;
    font-size: 38px; color: var(--pwr-red-d); margin: 0;
    border-top: 1px solid rgba(154,52,45,.25); padding-top: 18px;
  }
  .def-body { font-size: 30px; line-height: 1.4; color: var(--pwr-ink); margin: 0; text-wrap: pretty; }
  .def-side-h { font-family: var(--font-sans); font-size: 24px; letter-spacing: 0.14em;
                text-transform: uppercase; color: var(--pwr-red); font-weight: 700;
                border-bottom: 2px solid var(--pwr-red); padding-bottom: 14px; margin-bottom: 8px; }

  /* ─── Full-bleed photo overlay ───────────────────────────────────── */
  section.slide.bleed { padding: 0; overflow: hidden; }
  section.slide.bleed .bleed-img {
    position: absolute; inset: 0;
  }
  section.slide.bleed image-slot { width: 100%; height: 100%; display: block; }
  section.slide.bleed .bleed-shade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.0) 0%,
      rgba(0,0,0,0.0) 40%,
      rgba(0,0,0,0.55) 78%,
      rgba(0,0,0,0.85) 100%);
    pointer-events: none;
  }
  section.slide.bleed .bleed-content {
    position: absolute; left: var(--pad-x); right: var(--pad-x);
    bottom: 96px;
    color: var(--pwr-cream);
    display: flex; flex-direction: column; gap: 20px;
    z-index: 2;
  }
  section.slide.bleed .bleed-eye {
    font-family: var(--font-sans); font-size: 24px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--pwr-cream); font-weight: 700;
    border-left: 4px solid var(--pwr-red); padding-left: 16px;
    align-self: flex-start;
  }
  section.slide.bleed .bleed-title {
    font-family: var(--font-display); font-size: 80px;
    font-weight: 700; line-height: 1.04;
    letter-spacing: -0.02em; color: #fff; margin: 0;
    text-wrap: balance; max-width: 1500px;
  }
  section.slide.bleed .bleed-sub {
    font-size: 28px; line-height: 1.35; color: rgba(255,255,255,.85);
    margin: 0; max-width: 1300px;
  }
  section.slide.bleed .bleed-cred {
    position: absolute; top: 88px; right: var(--pad-x);
    font-family: var(--font-mono); font-size: 24px;
    color: rgba(255,255,255,.6);
    z-index: 2;
  }

  /* ─── 3-column comparison ────────────────────────────────────────── */
  .cols-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px; flex: 1; min-height: 0; }
  .cols-3 .compare { padding: 22px 22px 22px 0; padding-left: 24px; gap: 14px; }
  .cols-3 .compare-h { font-size: 32px; line-height: 1.15; }
  .cols-3 .compare-body { font-size: 24px; line-height: 1.35; }
  .cols-3 .compare-list li { padding: 10px 0; font-size: 24px; line-height: 1.3; }

  /* ─── Equation showcase ──────────────────────────────────────────── */
  .eq-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 64px; flex: 1; align-items: stretch; min-height: 0; }
  .eq-display {
    background: var(--pwr-cream-l);
    border-left: 8px solid var(--pwr-red);
    padding: 64px 56px;
    display: flex; flex-direction: column; gap: 36px;
    justify-content: center;
  }
  .eq {
    font-family: var(--font-serif);
    font-size: 64px; line-height: 1.2;
    text-align: center; color: var(--pwr-ink);
    margin: 0;
    font-variant-numeric: lining-nums;
  }
  .eq .var  { font-style: italic; }
  .eq .op   { color: var(--pwr-red); padding: 0 8px; font-style: normal; }
  .eq .fn   { color: var(--pwr-red-d); font-style: normal; }
  .eq .agg  { font-family: var(--font-sans); font-style: normal; font-weight: 600;
              font-size: 0.62em; letter-spacing: 0.04em; color: var(--pwr-red-d);
              vertical-align: 0.18em; }
  .eq sub, .eq sup { font-size: 0.55em; line-height: 0; }
  .eq sub { vertical-align: -0.25em; }
  .eq sup { vertical-align: 0.55em; }
  .eq-cap { font-family: var(--font-sans); font-size: 24px;
            color: var(--pwr-muted); text-align: center; margin: 0;
            font-style: italic; }
  dl.eq-vars { margin: 0; display: flex; flex-direction: column; gap: 18px; }
  dl.eq-vars > div {
    display: grid; grid-template-columns: 100px 1fr;
    gap: 20px; align-items: baseline;
    border-top: 1px solid var(--pwr-hair); padding-top: 14px;
  }
  dl.eq-vars > div:first-child { border-top: none; padding-top: 0; }
  dl.eq-vars dt {
    font-family: var(--font-serif); font-style: italic;
    font-size: 32px; color: var(--pwr-red);
  }
  dl.eq-vars dd { margin: 0; font-size: 24px; line-height: 1.35; color: var(--pwr-ink); }

  /* ─── Code / pseudocode ──────────────────────────────────────────── */
  .code-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 56px; flex: 1; min-height: 0; }
  .code-block {
    background: #1f1a17; color: #f5e6c8;
    padding: 28px 32px;
    font-family: var(--font-mono); font-size: 24px; line-height: 1.5;
    overflow: hidden;
    display: flex; flex-direction: column; gap: 0;
    border-top: 4px solid var(--pwr-red);
  }
  .code-block .filename {
    color: rgba(245,230,200,.5);
    font-size: 24px; padding-bottom: 14px; margin-bottom: 14px;
    border-bottom: 1px dashed rgba(245,230,200,.18);
    display: flex; justify-content: space-between;
  }
  .code-block .line {
    display: grid; grid-template-columns: 44px 1fr;
    gap: 16px; align-items: baseline;
  }
  .code-block .line.blank { min-height: 0.5em; }
  .code-block .ln { color: rgba(245,230,200,.28); text-align: right; user-select: none; font-variant-numeric: tabular-nums; }
  .code-block .kw  { color: #F1D1A2; font-weight: 600; }
  .code-block .cm  { color: rgba(245,230,200,.45); font-style: italic; }
  .code-block .fn  { color: #ffb37a; }
  .code-block .str { color: #d4b495; }
  .code-block .num { color: #f9ecd5; }
  .code-block .ind { display: inline-block; width: 1.5em; }

  body.code-light .code-block { background: var(--pwr-cream-l); color: var(--pwr-ink); border-top-color: var(--pwr-red); }
  body.code-light .code-block .filename { color: var(--pwr-muted); border-bottom-color: rgba(0,0,0,.12); }
  body.code-light .code-block .ln  { color: rgba(0,0,0,.28); }
  body.code-light .code-block .kw  { color: var(--pwr-red); }
  body.code-light .code-block .cm  { color: var(--pwr-muted); }
  body.code-light .code-block .fn  { color: var(--pwr-red-d); }
  body.code-light .code-block .str { color: #8a5a3a; }

  .code-notes { display: flex; flex-direction: column; gap: 28px; }
  .code-note { padding: 18px 20px 18px 22px; border-left: 4px solid var(--pwr-red); background: var(--pwr-cream-l); }
  .code-note h4 {
    font-family: var(--font-sans); font-size: 24px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--pwr-red); font-weight: 700; margin: 0 0 8px;
  }
  .code-note p { font-size: 24px; line-height: 1.4; color: var(--pwr-ink); margin: 0; }
  body.dark .code-note { background: #1f1d1b; }

  /* ─── Bar chart ──────────────────────────────────────────────────── */
  .chart-wrap { display: grid; grid-template-columns: 1.7fr 1fr; gap: 64px; flex: 1; min-height: 0; }
  .bar-chart { display: flex; flex-direction: column; min-height: 0; padding-top: 40px; }
  .bars-row {
    display: grid; grid-template-columns: repeat(6, 1fr);
    gap: 28px; flex: 1; align-items: end;
    border-bottom: 3px solid var(--pwr-ink);
    padding: 0 12px;
    min-height: 0;
  }
  .bar {
    background: var(--pwr-cream);
    display: flex; flex-direction: column; justify-content: flex-start;
    align-items: center;
    padding: 18px 8px 0;
    position: relative;
    min-height: 60px;
  }
  .bar.win { background: var(--pwr-red); }
  .bar.win .bar-val { color: var(--pwr-on-red); }
  .bar.win::after {
    content: "★"; position: absolute; top: -52px; left: 50%;
    transform: translateX(-50%);
    color: var(--pwr-red); font-size: 36px;
  }
  .bar-val {
    font-family: var(--font-mono); font-size: 26px; font-weight: 600;
    color: var(--pwr-red-d); text-align: center;
  }
  .bar-labels {
    display: grid; grid-template-columns: repeat(6, 1fr);
    gap: 28px; padding: 14px 12px 0;
  }
  .bar-label {
    text-align: center; font-family: var(--font-mono);
    font-size: 24px; color: var(--pwr-muted); letter-spacing: 0.04em;
  }
  .chart-side { display: flex; flex-direction: column; gap: 28px; justify-content: center;
                padding-left: 28px; border-left: 4px solid var(--pwr-cream); }
  .chart-callout-num { font-family: var(--font-display); font-size: 120px;
                       font-weight: 700; color: var(--pwr-red); line-height: 0.9;
                       letter-spacing: -0.04em; margin: 0; }
  .chart-callout-lbl { font-family: var(--font-sans); font-size: 26px;
                       color: var(--pwr-ink); line-height: 1.3; margin: 0; font-weight: 500; }
  .chart-side ul { list-style: none; margin: 8px 0 0; padding: 0; }
  .chart-side ul li {
    font-size: 24px; line-height: 1.4; color: var(--pwr-muted);
    padding: 12px 0; border-top: 1px solid var(--pwr-hair);
    display: grid; grid-template-columns: 24px 1fr; gap: 12px;
  }
  .chart-side ul li::before { content: "→"; color: var(--pwr-red); font-family: var(--font-mono); }
  .chart-y-axis {
    position: absolute; left: 0; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: space-between;
    font-family: var(--font-mono); font-size: 22px; color: var(--pwr-muted);
    padding: 12px 0;
  }

  /* ─── Image grid ─────────────────────────────────────────────────── */
  .img-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr;
              gap: 24px; flex: 1; min-height: 0; }
  .img-tile { display: flex; flex-direction: column; background: var(--pwr-cream-l);
              border: 1px solid var(--pwr-hair); min-height: 0; }
  .img-tile-frame { flex: 1; min-height: 0; overflow: hidden; }
  .img-tile image-slot { width: 100%; height: 100%; display: block; }
  .img-tile-cap {
    padding: 14px 18px; font-family: var(--font-mono); font-size: 24px;
    color: var(--pwr-muted); border-top: 1px solid var(--pwr-hair);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .img-tile-cap .pos { color: var(--pwr-red); font-weight: 600; }
  .img-tile-cap .neg { color: var(--pwr-muted); }

  /* ─── Contributions (numbered claim cards) ───────────────────────── */
  ol.claims { margin: 0; padding: 0; list-style: none;
              display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px;
              flex: 1; align-items: stretch; }
  ol.claims.fit-footer { padding-bottom: 34px; }
  ol.claims li {
    display: flex; flex-direction: column; gap: 18px;
    padding: 36px 32px 32px;
    background: var(--pwr-bg);
    border-top: 6px solid var(--pwr-red);
    box-shadow: 0 0 0 1px var(--pwr-hair);
    position: relative;
  }
  ol.claims .idx {
    font-family: var(--font-display); font-size: 96px;
    font-weight: 700; color: var(--pwr-red); line-height: 0.9;
    letter-spacing: -0.04em; margin: 0 0 8px 0;
  }
  ol.claims .claim-h { font-size: 34px; font-weight: 700; line-height: 1.15;
                       color: var(--pwr-ink); margin: 0; text-wrap: balance; }
  ol.claims .claim-d { font-size: 24px; line-height: 1.4; color: var(--pwr-muted);
                       margin: 0; }
  ol.claims .claim-tag {
    font-family: var(--font-mono); font-size: 24px;
    color: var(--pwr-red-d); margin-top: auto;
    padding-top: 14px; border-top: 1px dashed var(--pwr-hair);
  }
  body.dark ol.claims li { background: #1f1d1b; box-shadow: 0 0 0 1px var(--pwr-hair); }

  /* ─── Limitations ────────────────────────────────────────────────── */
  ul.limits { margin: 0; padding: 0; list-style: none; }
  ul.limits li {
    display: grid; grid-template-columns: 56px 1fr 360px;
    gap: 32px; align-items: center;
    padding: 24px 0;
    border-top: 1px solid var(--pwr-hair);
  }
  ul.limits li:last-child { border-bottom: 1px solid var(--pwr-hair); }
  ul.limits .lim-sign {
    font-family: var(--font-mono); font-size: 32px; font-weight: 600;
    color: var(--pwr-red);
  }
  ul.limits .lim-h { font-size: 30px; font-weight: 700; margin: 0 0 6px 0; color: var(--pwr-ink); }
  ul.limits .lim-d { font-size: 24px; line-height: 1.4; color: var(--pwr-muted); margin: 0; }
  ul.limits .lim-fix {
    background: var(--pwr-cream-l);
    padding: 16px 20px; border-left: 4px solid var(--pwr-red);
    font-size: 24px; line-height: 1.35; color: var(--pwr-ink);
  }
  ul.limits .lim-fix b {
    font-family: var(--font-sans); font-size: 24px;
    color: var(--pwr-red); letter-spacing: 0.12em;
    text-transform: uppercase; font-weight: 700;
    display: block; margin-bottom: 4px;
  }

  /* ─── Acknowledgements ───────────────────────────────────────────── */
  .ack-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 64px; flex: 1; min-height: 0; }
  .ack-col { display: flex; flex-direction: column; gap: 16px;
             padding-top: 24px; border-top: 4px solid var(--pwr-red); }
  .ack-tag { font-family: var(--font-sans); font-size: 24px; letter-spacing: 0.14em;
             text-transform: uppercase; color: var(--pwr-red); font-weight: 700; }
  .ack-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
  .ack-col li { font-size: 28px; line-height: 1.3; color: var(--pwr-ink); font-weight: 500; }
  .ack-col li .role { display: block; font-size: 24px; color: var(--pwr-muted); margin-top: 4px; font-weight: 400; }
  .ack-col li .grant { display: block; font-family: var(--font-mono); font-size: 24px;
                       color: var(--pwr-muted); margin-top: 4px; }

  /* ─── Backup / Appendix divider (dark variant) ───────────────────── */
  section.slide.divider.divider-dark {
    background: var(--pwr-ink);
  }
  section.slide.divider.divider-dark .rail { border-bottom-color: rgba(241, 209, 162, 0.18); }
  section.slide.divider.divider-dark .divider-num { color: rgba(241, 209, 162, 0.10); }
  section.slide.divider.divider-dark .divider-title { color: var(--pwr-cream); }
  section.slide.divider.divider-dark .divider-eyebrow { color: rgba(241, 209, 162, 0.7); }
  section.slide.divider.divider-dark .divider-rule { background: var(--pwr-cream); }
  section.slide.divider.divider-dark .divider-lede { color: rgba(241, 209, 162, 0.7); }
  section.slide.divider.divider-dark .divider-foot { color: rgba(241, 209, 162, 0.55); }

  /* ─── Bullet style tweak ─────────────────────────────────────────── */
  body.bullets-square ul.bullets li::before { transform: none; }
  body.bullets-dash ul.bullets li::before {
    width: 28px; height: 4px; margin-top: 22px; transform: none;
  }


</style>

<script type="application/json" id="speaker-notes">
{{SPEAKER_NOTES_JSON}}
</script>

<!-- ─── i18n: swap textContent on lang change ────────────────────── -->
<script id="i18n">
  (function() {
    function applyLang(lang) {
      const key = lang === 'pl' ? 'pl' : 'en';
      document.body.classList.toggle('lang-en', key === 'en');
      document.body.classList.toggle('lang-pl', key === 'pl');
      document.documentElement.lang = key;
      document.querySelectorAll('.i18n').forEach((el) => {
        const v = el.getAttribute('data-' + key);
        if (v != null) el.textContent = v;
      });
    }
    window.__applyLang = applyLang;
    applyLang('{{INITIAL_LANG}}'); // default; tweak panel will override
  })();
</script>

<script src="deck-stage.js"></script>
<script src="image-slot.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<div id="tweaks-mount"></div>

<script type="text/babel">
  const UNI_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{{TWEAK_DEFAULTS_JSON}}/*EDITMODE-END*/;

  function UniTweaksApp() {
    const [t, setTweak] = useTweaks(UNI_TWEAK_DEFAULTS);

    React.useEffect(() => {
      const r = document.documentElement.style;
      r.setProperty('--pwr-red', t.red);
      // Derive a darker shade for accents on cream
      const hex = t.red.replace('#','');
      const num = parseInt(hex, 16);
      const dr = Math.max(0, ((num >> 16) & 255) * 0.7) | 0;
      const dg = Math.max(0, ((num >> 8) & 255) * 0.7) | 0;
      const db = Math.max(0, (num & 255) * 0.7) | 0;
      r.setProperty('--pwr-red-d', '#' + ((1 << 24) | (dr << 16) | (dg << 8) | db).toString(16).slice(1));

      const cls = document.body.classList;
      cls.toggle('dark', !!t.dark);
      cls.remove('compact', 'spacious');
      if (t.density === 'compact')  cls.add('compact');
      if (t.density === 'spacious') cls.add('spacious');
      cls.toggle('no-footer', !t.footer);
      cls.toggle('no-partners', !t.showPartners);
      cls.remove('bullets-square', 'bullets-dash');
      if (t.bullets === 'square') cls.add('bullets-square');
      if (t.bullets === 'dash')   cls.add('bullets-dash');
      cls.toggle('code-light', t.codeTheme === 'light');

      if (window.__applyLang) window.__applyLang(t.lang);
    }, [t]);

    return (
      <TweaksPanel title="Tweaks">
        <TweakSection label="Language" />
        <TweakRadio
          label="Language"
          value={t.lang}
          options={[
            { value: 'en', label: 'English' },
            { value: 'pl', label: 'Polski' },
          ]}
          onChange={(v) => setTweak('lang', v)}
        />

        <TweakSection label="Brand" />
        <TweakColor
          label="Primary red"
          value={t.red}
          options={['#9A342D', '#7a0019', '#C00000', '#6c241f', '#000000']}
          onChange={(v) => setTweak('red', v)}
        />
        <TweakToggle
          label="Dark mode"
          value={t.dark}
          onChange={(v) => setTweak('dark', v)}
        />

        <TweakSection label="Layout" />
        <TweakRadio
          label="Density"
          value={t.density}
          options={[
            { value: 'compact',  label: 'Compact' },
            { value: 'regular',  label: 'Regular' },
            { value: 'spacious', label: 'Spacious' },
          ]}
          onChange={(v) => setTweak('density', v)}
        />
        <TweakToggle
          label="Show footer"
          value={t.footer}
          onChange={(v) => setTweak('footer', v)}
        />
        <TweakToggle
          label="Partner badges"
          value={t.showPartners}
          onChange={(v) => setTweak('showPartners', v)}
        />

        <TweakSection label="Detail" />
        <TweakRadio
          label="Bullets"
          value={t.bullets}
          options={[
            { value: 'diamond', label: '◆' },
            { value: 'square',  label: '■' },
            { value: 'dash',    label: '—' },
          ]}
          onChange={(v) => setTweak('bullets', v)}
        />
        <TweakRadio
          label="Code theme"
          value={t.codeTheme}
          options={[
            { value: 'dark',  label: 'Dark' },
            { value: 'light', label: 'Light' },
          ]}
          onChange={(v) => setTweak('codeTheme', v)}
        />
      </TweaksPanel>
    );
  }

  ReactDOM.createRoot(document.getElementById('tweaks-mount')).render(<UniTweaksApp />);
</script>

</body>
</html>
